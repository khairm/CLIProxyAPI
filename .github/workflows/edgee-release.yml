name: edgee-release

on:
  push:
    tags:
      - "v*-edgee.*"

permissions:
  contents: write

jobs:
  test-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.0"
          cache: false
      - name: Build all packages
        run: go build ./...
      - name: Run feature test suites
        run: |
          set -euo pipefail
          go test \
            ./cmd/server \
            ./internal/config \
            ./internal/logging \
            ./internal/runtime/executor \
            ./internal/runtime/executor/helps \
            ./internal/util \
            ./sdk/api/handlers \
            ./sdk/cliproxy \
            ./sdk/cliproxy/auth
          go test ./internal/api -run '^TestCodexOAuthRoute' -count=1
      - name: Race-test concurrency and route isolation
        run: >-
          go test -race -count=1
          -run 'Test.*(Concurrent|Concurrency|Isolation|MixedRoutes|RequestScoped)'
          ./internal/api
          ./internal/api/handlers/management
          ./internal/runtime/executor
          ./sdk/cliproxy/auth

  build-windows-arm64:
    needs: test-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.0"
          cache: false
      - name: Build windows/arm64 binary
        run: |
          set -euo pipefail
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o cli-proxy-api.exe ./cmd/server
      - name: Package and hash
        run: |
          set -euo pipefail
          ARCHIVE="CLIProxyAPI-edgee_${GITHUB_REF_NAME#v}_windows_aarch64.zip"
          zip -X "$ARCHIVE" cli-proxy-api.exe
          BINARY_SHA256=$(sha256sum cli-proxy-api.exe | awk '{print toupper($1)}')
          ARCHIVE_SHA256=$(sha256sum "$ARCHIVE" | awk '{print toupper($1)}')
          {
            echo "tag: ${GITHUB_REF_NAME}"
            echo "source_commit: ${GITHUB_SHA}"
            echo "go_version: $(go version)"
            echo "actions_checkout: 9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0"
            echo "actions_setup_go: 924ae3a1cded613372ab5595356fb5720e22ba16"
            echo "archive: ${ARCHIVE}"
            echo "archive_sha256: ${ARCHIVE_SHA256}"
            echo "binary: cli-proxy-api.exe"
            echo "binary_sha256: ${BINARY_SHA256}"
          } > build-manifest.txt
          cat build-manifest.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARCHIVE="CLIProxyAPI-edgee_${GITHUB_REF_NAME#v}_windows_aarch64.zip"
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Patched CLIProxyAPI build (codex-oauth-base-url / codex-oauth-headers) for claude-all edgee mode. Windows ARM64. See build-manifest.txt for provenance." \
            "$ARCHIVE" build-manifest.txt
